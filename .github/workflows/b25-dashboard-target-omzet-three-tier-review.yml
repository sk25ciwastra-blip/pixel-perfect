name: B25 Dashboard Target Omzet Three-Tier Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/routes/index.tsx'
      - 'src/lib/target-omzet.ts'
      - 'scripts/dashboard-target-omzet-three-tier.test.mjs'
      - 'scripts/dashboard-analytic-fill-contract.test.cjs'
      - '.github/workflows/b25-dashboard-target-omzet-three-tier-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target-omzet-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test pure omzet thresholds and three-stage dialog contract
        run: node --experimental-strip-types scripts/dashboard-target-omzet-three-tier.test.mjs
      - name: Preserve dashboard analytic layout and source data contracts
        run: node scripts/dashboard-analytic-fill-contract.test.cjs
      - uses: oven-sh/setup-bun@v2
      - name: Parse updated Dashboard TSX and pure target helper (offline module syntax)
        run: |
          bun build src/routes/index.tsx --target browser --external "*" --outdir /tmp/b25-dashboard-tsx
          bun build src/lib/target-omzet.ts --target browser --outdir /tmp/b25-target-helper
