name: B25 No6 closing presentation review
on:
  push:
    branches:
      - fix/no6-closing-labels-actor-fallback-20261123
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closing-source-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: node scripts/no6-closing-labels-source.test.cjs
      - run: bun run build
      - run: bunx tsc --noEmit
