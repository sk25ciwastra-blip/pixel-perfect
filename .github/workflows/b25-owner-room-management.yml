name: B25 Owner Room Management Separate Route
on:
  pull_request:
    branches: [main]
    paths:
      - src/routes/pengaturan.tsx
      - src/routes/pengaturan-manajemen-kamar.tsx
      - scripts/owner-room-management-route.test.ts
      - .github/workflows/b25-owner-room-management.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separate-room-management:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test scripts/owner-room-management-route.test.ts
      - run: bun run build
      - run: bunx tsc --noEmit
