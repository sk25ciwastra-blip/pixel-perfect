name: PR63 focused verification

on:
  push:
    branches:
      - feat/overtime-dashboard-kamar-20261113
  pull_request:
    paths:
      - src/routes/index.tsx
      - src/routes/kamar.tsx
      - src/lib/room-overtime.ts
      - src/lib/room-overtime-view.ts
      - src/lib/active-stay-pages.ts
      - src/lib/use-active-room-stays.ts
      - scripts/active-stay-pages-tests.cjs
      - scripts/room-overtime-view-tests.cjs
      - scripts/room-overtime-view-integration-tests.cjs
      - .github/workflows/pr63-validation.yml

permissions:
  contents: read

jobs:
  focused-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check TypeScript
        run: bunx tsc --noEmit
      - name: Test active-stay pagination
        run: node --experimental-strip-types scripts/active-stay-pages-tests.cjs
      - name: Test overtime view boundary
        run: node --experimental-strip-types scripts/room-overtime-view-tests.cjs
      - name: Test booking and overtime view coexistence
        run: node --experimental-strip-types scripts/room-overtime-view-integration-tests.cjs
      - name: Build application (no deploy)
        run: bun run build
