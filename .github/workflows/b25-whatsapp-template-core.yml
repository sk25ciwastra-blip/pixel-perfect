name: B25 WhatsApp Template Core Focused Gate

on:
  push:
    branches:
      - feat/whatsapp-template-core-20261125
  pull_request:
    branches:
      - main
    paths:
      - 'src/lib/whatsapp-template-core.ts'
      - 'src/lib/booking-quote.ts'
      - 'src/components/booking-quote.tsx'
      - 'scripts/whatsapp-template-core.test.ts'
      - 'scripts/whatsapp-template-booking.test.ts'
      - 'src/routes/pengaturan-template-whatsapp.tsx'
      - 'src/integrations/supabase/types.ts'
      - 'supabase/pending/20261125_whatsapp_templates_owner_only.sql'
      - 'scripts/whatsapp-template-postgres-fixture.sql'
      - '.github/workflows/b25-whatsapp-template-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Isolated PostgreSQL role and versioning regression
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f scripts/whatsapp-template-postgres-fixture.sql
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Pure template regression
        run: bun test scripts/whatsapp-template-core.test.ts scripts/whatsapp-template-booking.test.ts
      - name: Build and generate route types
        run: bun run build
      - name: TypeScript
        run: bunx tsc --noEmit
