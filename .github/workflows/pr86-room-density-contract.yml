name: PR86 focused room density contract (no deploy)
on:
  push:
    branches:
      - validation/pr86-room-contract-20261119
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated candidate
        uses: actions/checkout@v4
      - name: Setup Bun (locked dependencies)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - name: Install exact dependencies
        run: bun install --frozen-lockfile
      - name: Run only new PR86 source contracts
        run: node scripts/pr86-room-density-contract.test.mjs
