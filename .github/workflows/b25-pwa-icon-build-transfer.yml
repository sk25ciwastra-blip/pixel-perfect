name: B25 PWA Icon Generation (temporary branch check)
on:
  push:
    branches: [feat/pwa-foundation-safe-20261128]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  icon-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for public brand artwork only
        run: python -m pip install --disable-pip-version-check pillow
      - name: Produce square icons from committed official logo
        run: python scripts/generate-pwa-icons.py --emit-base64
