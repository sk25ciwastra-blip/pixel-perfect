name: B25 Private PostgreSQL 18 Restore Runner Safety
on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/b25_restore_private_windows_pg18.py'
      - 'scripts/test_b25_restore_private_pg18.py'
      - '.github/workflows/b25-private-pg18-restore-runner-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and help (no backup, no Cloud)
        run: |
          python -m py_compile scripts/b25_restore_private_windows_pg18.py
          python scripts/b25_restore_private_windows_pg18.py --help
      - name: Run offline synthetic fake-ZIP and manifest safety tests
        run: python -m unittest discover -s scripts -p 'test_b25_restore_private_pg18.py' -v
