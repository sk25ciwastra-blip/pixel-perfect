name: B25 Booking live publication evidence (read only)
# Lovable publishes to a CUSTOM audience (authorized user only).
# Anonymous HTTP 401 is expected; don't auto-fail main on every source commit.
# Run manually only if the Owner explicitly changes release visibility.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-client-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public source, without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify public Lovable app serves PR104 Booking client bundle
        run: python3 scripts/b25-booking-public-live-check.py
