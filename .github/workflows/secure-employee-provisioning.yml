name: Secure employee provisioning focused validation
on:
  pull_request:
    paths:
      - 'src/lib/employee*'
      - 'scripts/secure-employee*'
      - scripts/tsconfig.secure-employees.json
      - supabase/pending/20261113174830_secure_employee_provisioning.sql
      - .github/workflows/secure-employee-provisioning.yml
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact reviewed dependency snapshots (no merge)
        run: git fetch --no-tags origin b4a486c747202031e52a06a5cf9d67126fc83654 b9460e98e56ea0a58da828f2208a468e8cdb09af
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Install pinned isolated PostgreSQL fixture
        run: npm install --prefix "$RUNNER_TEMP/secure-employee-pg" --ignore-scripts --no-audit --no-fund --package-lock=false @electric-sql/pglite@0.3.14
      - name: Focused service and recovery tests
        run: node scripts/secure-employee-service-tests.cjs
      - name: Integrated pending SQL on isolated PostgreSQL
        run: BTRD25_PGLITE_MODULE="$RUNNER_TEMP/secure-employee-pg/node_modules/@electric-sql/pglite" node scripts/secure-employee-sql-tests.cjs
      - name: Focused typecheck
        run: bunx tsc --noEmit -p scripts/tsconfig.secure-employees.json
      - name: Build only, no deploy
        run: bun run build
