name: B25 self-service password security (review only)

on:
  push:
    branches:
      - feat/own-password-security-settings-20261121
    paths:
      - .github/workflows/b25-own-password-review.yml
      - src/lib/own-password.ts
      - src/routes/pengaturan-keamanan.tsx
      - src/routes/pengaturan.tsx
      - src/routes/__root.tsx
      - src/components/kerangka.tsx
      - scripts/own-password-security-tests.cjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b25-password-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-password-review:
    if: github.ref == 'refs/heads/feat/own-password-security-settings-20261121'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout review branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node for test and build only
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing project lockfile dependencies
        run: npm ci --no-audit --no-fund
      - name: Run focused mocked Auth checks
        run: node scripts/own-password-security-tests.cjs
      - name: Compile application and generate route tree
        run: npm run build
      - name: Typecheck application
        run: npx tsc --noEmit
