name: B25 employee password error feedback (review only)
on:
  push:
    branches:
      - fix/employee-own-password-auth-feedback-20261122
    paths:
      - .github/workflows/b25-password-error-feedback-review.yml
      - src/lib/own-password.ts
      - scripts/own-password-security-tests.cjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  password-message-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test self-service password checks offline
        run: node scripts/own-password-security-tests.cjs
      - name: Build current routes with safer error feedback
        run: bun run build
      - name: TypeScript checks
        run: bunx tsc --noEmit
