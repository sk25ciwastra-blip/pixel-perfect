<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090A">
  <title>Anda sedang offline · Baturaden 25 Homestay</title>
  <style>
    :root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;background:#08090a;color:#f5f0e6}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 22%,#302316,#08090a 60%)}
    main{width:min(100%,430px);padding:36px 25px;text-align:center;border:1px solid #735a30;border-radius:23px;background:#111112;box-shadow:0 16px 70px #0009}
    .brand{font-size:12px;letter-spacing:.18em;color:#d0ab61;font-weight:700}
    h1{font-size:25px;margin:24px 0 10px}p{font-size:15px;line-height:1.6;color:#d0c9bd}
    button{appearance:none;margin-top:15px;border:0;border-radius:12px;padding:13px 22px;background:linear-gradient(#e9c778,#b88c3e);color:#0b0a08;font-size:15px;font-weight:700;cursor:pointer}
    button:focus-visible{outline:3px solid #fff;outline-offset:3px}
    small{display:block;margin-top:19px;color:#a9a093;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="brand">BATURADEN 25 HOMESTAY</div>
    <h1>Koneksi internet terputus</h1>
    <p>Untuk menjaga keamanan dan keakuratan data, Booking, transaksi, tamu, dan kas hanya dapat diakses saat terhubung ke internet.</p>
    <button type="button" onclick="location.reload()">Coba Lagi</button>
    <small>Tidak ada transaksi yang disimpan secara offline.</small>
  </main>
</body>
</html>
